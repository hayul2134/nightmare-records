<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="NIGHTMARE RECORDS emblem">
  <defs>
    <linearGradient id="nrMoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efff"/>
      <stop offset=".55" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
    <mask id="nrCut"><rect width="120" height="120" fill="#fff"/><circle cx="74" cy="52" r="40" fill="#000"/></mask>
  </defs>
  <!-- vinyl record -->
  <circle cx="68" cy="60" r="36" fill="#120d22" stroke="#c9b8ff" stroke-opacity=".35"/>
  <g fill="none" stroke="#c9b8ff" stroke-opacity=".22" stroke-width=".8">
    <circle cx="68" cy="60" r="31"/><circle cx="68" cy="60" r="27"/><circle cx="68" cy="60" r="23"/><circle cx="68" cy="60" r="19"/>
  </g>
  <path d="M68 29a31 31 0 0 1 26 14" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
